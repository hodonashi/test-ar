<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイ3Dモデル</title>
  <style>
    body   { margin:0; overflow:hidden; background:#111; }

<model-viewer
