<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>model-viewerデモ</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.js"></script>
  <meta name="robots" content="noindex,noarchive,nofollow,noimageindex">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;           /* これ大事！ */
      display: flex;          /* Flexbox有効 */
      justify-content: center; /* 左右中央 */
      align-items: center;    /* 上下中央 */
      background: #70BCD1;    /* 背景色をここで統一してもOK */
    }

    model-viewer {
      width: 90vw;            /* 画面幅の90%（スマホ対応） */
      height: 90vh;           /* 画面高さの90% */
      max-width: 1200px;      /* 大画面で広がりすぎないように（任意） */
      max-height: 800px;
    }
  </style>
</head>
<body>

<model-viewer
  alt="hanachan"
  src="Suzanne.glb"
  background-color="#70BCD1"
  shadow-intensity="0.7"
  camera-controls
  autoplay
  auto-rotate
  ar
  ar-modes="webxr scene-viewer quick-look">   <!-- AR安定用に追加推奨 -->
</model-viewer>

</body>
</html>
