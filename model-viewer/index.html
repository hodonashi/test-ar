<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイ3Dモデル</title>
  <style>
    body   { margin:0; overflow:hidden; background:#FFFFFF; }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
  <!-- Google model-viewer を読み込む（ネットから直接） -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

<model-viewer 
  src="Suzanne.glb"
  alt="私の3Dモデル"
  auto-rotate
  camera-controls
  ar
  ar-modes="webxr scene-viewer quick-look"
  ios-src="your-model.usdz"  <!-- iOS専用USDZがあればここに（なくてもOK） -->
  shadow-intensity="1"
  environment-image="neutral"
  background-color="#ffffff"
  style="width:100vw; height:100vh; background-color: #ffffff;">

  <!-- カスタムARボタン（目立つやつ） -->
  <button slot="ar-button"
          style="position: absolute; 
                 bottom: 30px; 
                 left: 50%; 
                 transform: translateX(-50%);
                 padding: 16px 32px;
                 font-size: 20px;
                 font-weight: bold;
                 background: linear-gradient(#00aaff, #0066ff);
                 color: white;
                 border: none;
                 border-radius: 50px;
                 box-shadow: 0 6px 20px rgba(0,0,0,0.5);
                 cursor: pointer;
                 z-index: 999;">
    📱 ARでみる
  </button>

  <!-- AR起動時の案内（オプション） -->
  <div slot="ar-prompt" style="position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); color: white; font-size: 18px; text-align: center; pointer-events: none;">
    タップして床に置くよ！
  </div>

</model-viewer>

</body>
</html>
