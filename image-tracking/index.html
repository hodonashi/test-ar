<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>  <!-- 1.6.0より1.5.0の方が安定報告多い -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.2/aframe/build/aframe-ar-nft.js"></script>
  <!-- ↑ 最新タグでなく安定版指定。@masterは不安定な時あり -->
  
  <style>
    body { margin: 0; overflow: hidden; }
    .arjs-loader { 
      position: absolute; inset: 0; 
      background: rgba(0,0,0,0.8); color: white; 
      display: flex; align-items: center; justify-content: center; 
      z-index: 9999; font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div class="arjs-loader">Loading, please wait...</div>

  <a-scene 
    embedded 
    vr-mode-ui="enabled: false" 
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">

    <!-- trex公式サンプルでテスト -->
    <a-nft 
      type="nft" 
      url="https://raw.githack.com/AR-js-org/AR.js/master/aframe/examples/image-tracking/nft/trex/trex-image/trex"
      smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
      <a-plane position="0 0 0" rotation="-90 0 0" width="1" height="1" material="color: red; transparent: true; opacity: 0.7"></a-plane>
      <!-- まずはシンプルな平面でマーカー検出確認 -->
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // ロード完了を強制的に隠す（デバッグ用）
    setTimeout(() => {
      const loader = document.querySelector('.arjs-loader');
      if (loader) loader.style.display = 'none';
    }, 15000); // 15秒後強制非表示（テスト用）

    // イベントで隠す（本来はこれ）
    document.addEventListener('arjs-nft-loaded', () => {
      document.querySelector('.arjs-loader').style.display = 'none';
      console.log('NFT descriptors loaded OK');
    });
  </script>
</body>
</html>
