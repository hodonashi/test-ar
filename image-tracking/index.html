<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.2/aframe/build/aframe-ar-nft.js"></script>
  <style>
    body { margin:0; overflow:hidden; }
    .arjs-loader { position:absolute; inset:0; background:rgba(0,0,0,0.8); color:white; display:flex; align-items:center; justify-content:center; z-index:9999; }
  </style>
</head>
<body>
  <div class="arjs-loader">Loading descriptors...</div>

  <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-nft type="nft" 
           url="https://raw.githack.com/hodonashi/image-tracking/maccha-suzanne/maccha-suzanne-image/imagetest" 
           smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
      <a-entity gltf-model="https://raw.githack.com/hodonashi/image-tracking/maccha-suzanne/maccha-suzanne.glb"
                scale="3 3 3" position="0 0.5 0"></a-entity>
    </a-nft>
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    document.addEventListener('arjs-nft-loaded', () => {
      document.querySelector('.arjs-loader').style.display = 'none';
    });
  </script>
</body>
</html>
